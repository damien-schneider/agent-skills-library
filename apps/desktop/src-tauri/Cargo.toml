[package]
name = "agents-library-desktop"
version = "0.0.1"
description = "Local manager for agent configuration files"
authors = ["Damien Schneider <damien-schneider>"]
edition = "2021"
license = "MIT"
default-run = "agents-library-desktop"

[profile.dev]
incremental = true

[lib]
name = "agents_library_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
notify = "8.2"
notify-debouncer-full = "0.7"
similar = "3"
crossbeam-channel = "0.5"
dirs = "6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
