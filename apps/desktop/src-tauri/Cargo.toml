[package]
name = "another-dev-tool"
version = "0.0.7"
description = "Local manager for agent configuration files"
authors = ["Damien Schneider <damien-schneider>"]
edition = "2021"
license = "MIT"
default-run = "another-dev-tool"

[profile.dev]
incremental = true

[lib]
name = "another_dev_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
notify = "8.2"
notify-debouncer-full = "0.7"
similar = "3"
crossbeam-channel = "0.5"
dirs = "6"
tauri-plugin-clipboard-manager = "2.3.2"
png = "0.18.1"
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
axuielement = "0.9.1"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSObject", "NSString"] }

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
